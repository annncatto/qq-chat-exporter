<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>跑团 log 整理</title>
    <link rel="stylesheet" href="qce-chat.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="core.js" defer></script>
    <script src="viewport.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="trpg-review-flow" aria-label="跑团 log 整理">
      <header class="r-header">
        <span class="r-title" id="rr-title">跑团 log 整理</span
        ><span id="rr-progress" class="r-meta" aria-live="polite"></span
        ><span id="rr-save" class="r-meta" role="status"></span>
        <div class="r-files">
          <details id="rr-open-menu">
            <summary>文件</summary>
            <div class="r-menu">
              <button type="button" id="rr-open">导入记录（可多选）</button
              ><button type="button" id="rr-open-project">打开工程</button
              ><button type="button" id="rr-save-project" disabled>
                保存工程</button
              ><button type="button" id="rr-new">新建 log</button>
              <div id="rr-recents"></div>
            </div>
          </details>
          <details id="rr-export-menu">
            <summary>导出</summary>
            <div class="r-menu">
              <button type="button" data-export="txt" disabled>TXT</button
              ><button type="button" data-export="md" disabled>Markdown</button
              ><button type="button" data-export="html" disabled>HTML</button>
            </div>
          </details>
        </div>
      </header>
      <input
        id="rr-file"
        type="file"
        accept=".json,.jsonl,.txt,.qcelog"
        multiple
        hidden
      /><input id="rr-project-file" type="file" accept=".qcelog,.json" hidden />
      <div id="rr-error" role="alert" hidden></div>
      <section class="r-empty-screen" id="rr-empty">
        <h1>开始整理跑团记录</h1>
        <div>
          <button type="button" id="rr-open-empty">导入记录</button
          ><button type="button" id="rr-demo">使用示例</button>
        </div>
      </section>
      <div class="r-layout" id="rr-workspace" hidden>
        <details id="rr-sidebar" class="r-sidebar r-rail">
          <summary>窗口／角色</summary>
          <div class="r-panel-body">
            <div class="r-panel-tabs">
              <button type="button" id="rr-windows-tab" aria-pressed="true">
                窗口</button
              ><button type="button" id="rr-roles-tab" aria-pressed="false">
                角色
              </button>
            </div>
            <div id="rr-windows"></div>
            <div id="rr-roles" hidden></div>
            <nav class="r-nav">
              <button type="button" id="rr-unassigned">
                待归类 <span id="rr-unassigned-count">0</span>
              </button>
            </nav>
            <details class="r-role-directory">
              <summary>角色与章节</summary>
              <div id="rr-directory"></div>
            </details>
          </div>
        </details>
        <main class="r-main">
          <div class="r-toolbar">
            <div class="r-view-tabs">
              <button type="button" id="rr-all" aria-pressed="true">原文</button
              ><button type="button" id="rr-draft-view" aria-pressed="false">
                整理稿
              </button>
            </div>
            <input
              id="rr-search"
              aria-label="定位内容、时间或消息序号"
              placeholder="查找或跳转"
              autocomplete="off"
            /><button type="button" id="rr-locate">查找</button
            ><button type="button" id="rr-prev">上一条</button
            ><button type="button" id="rr-next">下一条</button
            ><button type="button" id="rr-return" hidden>返回审阅</button
            ><span class="r-toolbar-spacer"></span>
            <details class="r-split-menu">
              <summary>分屏</summary>
              <div class="r-menu">
                <button type="button" id="rr-split-horizontal">左右分屏</button
                ><button type="button" id="rr-split-vertical">上下分屏</button
                ><button type="button" id="rr-add-pane">增加阅读窗</button
                ><button type="button" id="rr-single-pane">单窗阅读</button>
              </div>
            </details>
            <button type="button" id="rr-flow" aria-pressed="false">
              心流
            </button>
          </div>
          <div class="r-scope">
            <span id="rr-scope">全部原文</span><span id="rr-total"></span
            ><label id="rr-select-all-label" hidden
              ><input type="checkbox" id="rr-select-all" />全选本组</label
            ><span id="rr-selection-count"></span
            ><button type="button" id="rr-clear-selection" hidden>
              取消选择
            </button>
          </div>
          <div id="rr-panes" class="r-panes" aria-label="聊天记录阅读区"></div>
          <footer class="r-footer">
            <div class="r-actions">
              <button
                type="button"
                id="rr-current-location"
                class="r-current-location"
              >
                当前条</button
              ><button type="button" class="r-primary" id="rr-keep">
                保留 <kbd>A</kbd></button
              ><button type="button" id="rr-exclude">排除 <kbd>S</kbd></button
              ><button type="button" id="rr-edit">编辑 <kbd>E</kbd></button
              ><button type="button" id="rr-undo" disabled>
                撤销 <kbd>Ctrl Z</kbd>
              </button>
            </div>
            <div class="r-assignment">
              <label
                ><input type="checkbox" id="rr-use-section" />当前整理</label
              ><input
                id="rr-round"
                list="rr-rounds"
                placeholder="章节／回合名称"
                maxlength="60"
                aria-label="当前章节或回合"
                autocomplete="off"
              /><datalist id="rr-rounds"></datalist
              ><button type="button" id="rr-assign">使用</button>
            </div>
            <output id="rr-status" aria-live="polite"></output>
          </footer>
        </main>
        <details id="rr-sections-panel" class="r-sections r-rail">
          <summary>章节／回合</summary>
          <div class="r-panel-body">
            <table id="rr-sections-table">
              <thead>
                <tr>
                  <th>章节／回合</th>
                  <th>保留</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rr-sections-body"></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
  </body>
</html>
